[package]
name = "xtask"
version = "0.1.0"
edition = "2024"
publish = false
description = "本机验证入口（cargo verify）：check / test / wasm / structure / smoke / hashes"

# 独立 workspace：**不加入**根 workspace 的 members。
# 根 workspace 有 34 个成员且没有 default-members，混入会让
# `cargo check --workspace --all-targets` 与 wasm gate 一并检查本 crate。
[workspace]

# 唯一依赖，且它是**纯 std**（`ze-graph-core` 自己零依赖）⇒ xtask 仍然没有第三方依赖。
# 用途（阶段 5）：按依赖选测试 —— `dirty_downstream` 算受影响的下游 crate。
[dependencies]
ze-graph-core = { path = "../crates/kernel/ze-graph-core" }
