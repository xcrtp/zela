[package]
name = "ze-pod-func"
version.workspace = true
edition.workspace = true
license.workspace = true

description = "Expression functor pod (zela.math namespace): leaf operators as a capability"

# 依赖铁律（与 `crates/ze/pod` 其余成员一致）：
#   ✅ ze-pod-core / ze-pod-macro — Pod / capability 机制
#   ✅ ze-func — 组合子表达式内核（kernel 层，不含宿主状态）
#   ✅ serde_json — 表达式导出（产物侧证据）
#   ❌ 任何 zela-* —— 由 `cargo verify --step structure` 的 JQ_POD_LAYER 判据守住
[dependencies]
ze-pod-core = { path = "../ze-pod-core" }
ze-pod-macro = { path = "../ze-pod-macro" }
ze-func = { path = "../../../kernel/ze-func" }
serde_json.workspace = true

[dev-dependencies]
ze-pod-binding = { path = "../ze-pod-binding" }
ze-pod-lua = { path = "../ze-pod-lua" }
