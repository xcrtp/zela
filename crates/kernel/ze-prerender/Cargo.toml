[package]
name = "ze-prerender"
version.workspace = true
edition.workspace = true
license.workspace = true

# kernel 层重 crate：内容排版引擎实现（Typst / LaTeX 等）。
# 注意：所有重型引擎依赖必须放在 feature 后；未启用 feature 时应零重依赖。
# kernel 约定：禁止依赖 graph / render / ui / app（ze-* / zela-* 上层）。

[dependencies]
ze-notion = { path = "../ze-notion" }
ze-content = { path = "../ze-content" }
# CG-b：`TextRun`（字符索引 ↔ 矩形）与结构化帧同住 `ze-interact`。
ze-interact = { path = "../ze-interact" }
thiserror = { workspace = true }
derive_more = { workspace = true }
# 诊断输出（替代 eprintln!，由订阅方决定是否可见）。
tracing = { workspace = true }

# Typst 引擎依赖（全部 optional，由 feature = "typst" 打开）。
typst = { version = "0.14", optional = true }
# `typst-library` 在本 crate 源码中零直接 `use`：它是 `typst` 的版本锁定依赖，
# 保证 workspace 内 typst 全家桶版本一致（不要因"零引用"而删除）。
typst-library = { version = "0.14", optional = true }
ecow = { version = "0.2", optional = true }
fontdb = { version = "0.16", optional = true }
ttf-parser = { version = "0.25", optional = true }

[dev-dependencies]
ze-content = { path = "../ze-content" }
serde_json.workspace = true

[features]
default = []
# CG-a：字体度量（`fontdb` 找字体 + `ttf-parser` 取 advance）。
# 与 typst 共用同一批可选依赖，但**不依赖 typst**：度量是独立验收面。
metrics = ["dep:fontdb", "dep:ttf-parser", "ze-content/serde"]
# Typst 排版引擎。打开时会引入 typst workspace 共 ~15 个 crate。
typst = [
    "dep:typst",
    "dep:typst-library",
    "dep:ecow",
    "metrics",
]
# 占位引擎（用 ze-content placeholder；默认可用，不需要额外依赖）。
placeholder = []
