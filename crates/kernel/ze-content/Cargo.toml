[package]
name = "ze-content"
version.workspace = true
edition.workspace = true
license.workspace = true

# kernel 层轻 crate：IR 数据类型 + SVG 序列化 + 占位生成器。
# 禁止依赖 typst / egui / wgpu / hecs。

[dependencies]
ze-notion = { path = "../ze-notion" }
# CG-c：文本的逐字符盒（`TextRun`）与结构化帧一起住在 `ze-interact`（内部 f64）。
ze-interact = { path = "../ze-interact" }
serde = { workspace = true, optional = true }

[features]
default = []
serde = ["dep:serde", "ze-notion/serde", "ze-interact/serde"]

[dev-dependencies]
serde_json.workspace = true
