[package]
name = "zela-scene-bundle"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "ZSB 场景装配产物：格式 + 读写 + 内容 hash + 可还原性检查（无脚本依赖）"

[dependencies]
# 装配产物 = `SceneScript`（声明式创建 + 时间线）。本 crate **不依赖任何语言适配器**：
# 浏览器侧只引这一个轻 crate 即可回放。
zela-scene-ecs = { path = "../zela-scene-ecs" }
# CD-b：`Bundle::text_sources` 返回内部内容源组件（`restore` / `rebuild` 双轨的源侧）。
# 该 crate 层级低于本层（契约 / 核心），不引入语言适配器或 GPU 依赖。
ze-scene-core = { path = "../ze-scene-core" }
# B4 Step 2：Meta 承载渲染参数（纯数据，kernel 层，不引入 GPU 依赖）。
ze-render-ir = { path = "../../kernel/ze-render-ir" }
serde.workspace = true
serde_json.workspace = true

# B8 Step 3′0：**帧序列哈希**的快路径（每帧 1.2 MB）。只在非 wasm 目标引入 ——
# wasm 侧仍走本 crate 自带的手写实现（见 `sha256::sha256_fast`），保持格式 crate 极轻。
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
sha2.workspace = true

[dev-dependencies]
# 输入流用例构造带函子库身份的表达式绑定。
ze-comb = { path = "../../kernel/ze-comb" }
