[package]
name = "zela-node-egui-ui"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "egui widget mappings for ze-node-schema property nodes (draw_property / PropertyNodeView / spawn menu)"

[dependencies]
ze-node-core = { path = "../../ze/graph/ze-node-core" }
ze-node-schema = { path = "../../ze/graph/ze-node-schema" }
zela-node-egui = { path = "../zela-node-egui" }
# `NodePos`（图坐标位置）来自状态机层；尺寸提示必须与编辑器同一口径。
zela-node-editor = { path = "../zela-node-editor" }
egui = { workspace = true }

[dev-dependencies]
eframe = { workspace = true, features = ["default_fonts"] }
